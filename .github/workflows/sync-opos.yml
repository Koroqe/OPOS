# sync-opos — keeps this company's OPOS up to date, unattended.
#
# Every night it asks whether a newer OPOS release exists. If one does and it is safe to apply,
# it applies it, verifies the result, and pushes it to the default branch. If it is not safe, it
# stops, turns the run red, and files ONE `[opos-auto-sync]` issue saying exactly what a human
# must do. The logic lives in shared/scripts/opos-auto-update.mjs (plain Node; no LLM, no API key,
# no cloud app).
#
# SWITCH IT ON (a human does this once — scheduling is never self-registered, never-automate
# invariant 3):
#     gh variable set OPOS_AUTO_SYNC --body on
# Until then every run skips in a second. Switch it off the same way with `--body off`.
#
# What it applies by itself: any release whose changes pass `verify-sync` (no local customisation
# reverted), produce no conflicts, and touch no file under `.github/workflows/`.
#
# What it hands to a human, with an issue: conflicts; a failed verification; and any release that
# changes a workflow file. The last is not a choice — GitHub rejects workflow-file changes pushed
# with the Actions token ("refusing to allow a GitHub App to create or update workflow … without
# `workflows` permission", verified 2026-09-23), and invariant 3 forbids a scheduled run from
# writing workflow files anyway. Apply such a release once with the `sync-from-core` skill; the
# driver then carries on by itself.
#
# ONE DRIVER PER REPO: while OPOS_AUTO_SYNC is on, do not also register the `auto-sync` skill as a
# routine — its preflight refuses to run when this switch is on.
#
# Runs on Linux on purpose: on Windows `copier update` silently drops local customisations
# (WinError 206, OPOS RISKS 42).
name: sync-opos

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly — when nobody is likely to hold an editing lease
  workflow_dispatch:
    inputs:
      min_release_age_hours:
        description: "Wait this long after a release before applying it (0 = apply now)"
        required: false
        default: "24"

permissions:
  contents: write   # commit and push the update
  issues: write     # escalation issues; lease claims on the registry

concurrency:
  group: sync-opos
  cancel-in-progress: false

jobs:
  update:
    if: ${{ vars.OPOS_AUTO_SYNC == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install copier
        run: pip install --quiet copier
      - name: Apply the latest OPOS release if it is safe to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPOS_MIN_RELEASE_AGE_HOURS: ${{ inputs.min_release_age_hours || '24' }}
          # Scheduled runs may carry no repository object in the event payload; github.ref_name is
          # the default branch there, so it is the reliable fallback.
          OPOS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: node shared/scripts/opos-auto-update.mjs
