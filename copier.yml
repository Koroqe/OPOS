_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "<<"
  variable_end_string: ">>"
  comment_start_string: "<#"
  comment_end_string: "#>"

_templates_suffix: ""

_min_copier_version: "9.0.0"

_exclude:
  - .git
  - .claude/.current-task
  - .claude/.last-update-check
  - .claude/scratchpad.md
  - "**/history/202[0-9]-*.md"
  - copier.yml
  - MAINTAINER.md   # framework-developer guide; not for consumers

# Files shipped on initial scaffold only; never updated by `copier update`.
# Consumers own these post-scaffold and may edit freely without losing edits.
_skip_if_exists:
  - .mcp.json
  - .claude/settings.json
  - .claude/task-tracking.config.json
  - .claude/agents/engineering/**
  - .claude/agents/rnd/**
  - company/CLAUDE.md
  - company/strategy/**
  - company/policies/**
  - company/knowledge-base/**
  - company/backlog/**
  - departments/**

COMPANY_NAME:
  type: str
  help: Your company name (replaces <<COMPANY_NAME>> throughout)
