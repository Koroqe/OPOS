_min_copier_version: "9.0.0"

# Default _templates_suffix is ".jinja" — only files with that suffix are
# processed through Jinja substitution. Files without the suffix are copied
# verbatim. The 5 templated files (CLAUDE.md, README.md, RISKS.md, company/
# CLAUDE.md, departments/*/CLAUDE.md) are stored as *.md.jinja; Copier strips
# the suffix on render to produce the destination filenames.
#
# CAUTION: never add a bare root README.md (or any bare file whose *.jinja
# sibling exists). Both resolve to the same destination and the winner is
# filesystem-walk-order dependent — a v0.7.2 regression shipped the framework
# readme verbatim to consumers this way. Excluding the bare file is NOT a fix:
# _exclude matches the RENDERED destination path, so it would drop the .jinja
# output too. The framework's own GitHub readme therefore lives at
# .github/README.md (GitHub prefers that path for repo display) and is
# excluded there, where no collision is possible.

_exclude:
  - .git
  - .claude/.current-task
  - .claude/.paused-tasks
  - .claude/.last-update-check
  - .claude/scratchpad.md
  - "**/history/202[0-9]-*.md"
  - "**/scheduled-runs/202[0-9]-*.md"   # v0.6.0: per-adopter scheduled-run records; runtime-only, never shipped
  - .claude/scheduled-processes.json    # v0.6.0: per-machine routine-id cache; gitignored + excluded
  - "company/decisions/202[0-9]-*.md"   # v0.6.1: per-adopter decision artifacts written by deliberate-decision; README + .gitkeep DO ship (not in _skip_if_exists)
  - "company/backlog/*.md"           # v0.14.1: ALL maintainer backlog items (dated or not) stay in the framework repo —
  - "!company/backlog/README.md"     #          the v0.13.1 dated-only pattern still leaked undated ones (2nd occurrence of
                                     #          mistake_class: maintainer-backlog-leaks-to-consumers). README + .gitkeep DO ship.
  - "tasks/[0-9]*.md"       # framework's own dogfooded task files; consumers get empty tasks/ via .gitkeep
  - "tasks/closed/**"        # same as above for completed tasks
  - "ui/tests/**"           # framework-dogfooded tests asserting on OPOS's own agent/skill counts
  - "ui/smoke.sh"           # smoke script asserting on framework-specific routes; consumers run their own
  - copier.yml
  - MAINTAINER.md   # framework-developer guide; not for consumers
  - .github/README.md   # framework's own GitHub readme (see CAUTION above)
  - .github/workflows/ci.yml   # v0.11: framework-repo CI (incoming-PR gates); consumers run their own CI
  - .claude/skills/triage-incoming-prs   # v0.11: maintainer-side triage skill; meaningless in a consumer scaffold
  - .github/images      # framework marketing assets (hero image) referenced only by the framework readme
  - .github/docs        # framework marketing/GEO guide pages linked only from the framework readme; never consumer-facing
  - docs                 # v0.9.0 (pattern fixed v0.10): framework-development SDLC docs (PRD, use cases, QA, architecture, audits); never consumer-facing — excluding the dir itself avoids an empty docs/ in scaffolds
  - "company/resources/requests/202[0-9]-*.md"   # v0.13: per-adopter access-request specs (redaction-sensitive; never shipped)
  - "**/proposals/202[0-9]-*.md"   # v0.9.0: per-adopter propose-to-core draft files — exist BECAUSE redaction failed, so they carry company data and must never ship to another consumer. README + LEDGER + .gitkeep DO ship (mirrors the company/decisions pattern).

# Files shipped on initial scaffold only; never updated by `copier update`.
# Consumers own these post-scaffold and may edit freely without losing edits.
_skip_if_exists:
  - CHANGELOG.md   # v0.15: consumer-owned after scaffold. The dual-section layout (consumer day blocks above framework `## [x.y.z]` sections) means copier REPLACES this file on every update and rejects the consumer's day-block hunk — a conflict every consumer hits on every sync, forever. Framework release notes live on the GitHub releases page and in the sync summary, so consumers lose nothing by freezing their copy at scaffold time.
  - CLAUDE.md      # v0.5.0: root constitution becomes consumer-owned (Mission and Values are founder-content written by /company-setup). Trade-off: framework changes to root CLAUDE.md no longer auto-propagate.
  - .mcp.json
  - .claude/settings.json
  - .claude/task-tracking.config.json
  - .claude/agents/engineering/**
  - .claude/agents/rnd/**
  - company/CLAUDE.md
  - company/strategy/**
  - company/policies/**
  - company/knowledge-base/**
  - company/backlog/**
  - company/hiring/**     # v0.5.1: job specs written by allocate-resource (people-lead's human route); founder-owned post-scaffold
  - company/resources/**  # v0.13: the tooling registry — consumer-owned post-scaffold (README/REGISTRY ship once; new upstream resource-kind docs arrive as new files)
  - departments/**
  - .claude/skills/propose-to-core/proposals/LEDGER.md   # v0.9.0: shipped once, consumer-mutated thereafter (the proposal dedupe ledger) — an upstream edit to it would otherwise .rej on every active consumer

COMPANY_NAME:
  type: str
  help: Your company name (substituted into all CLAUDE.md and README files)
